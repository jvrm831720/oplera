name: Fix V0.4.2 lint once

on:
  push:
    branches:
      - feat/durable-supabase-runtime-v0.4.2

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - name: Apply scoped Biome unsafe fix
        run: bunx biome check --write --unsafe api/autonomy/postgres-task-queue.ts
      - name: Remove one-shot workflow
        run: rm .github/workflows/fix-v0.4.2-lint.yml
      - name: Commit lint fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "style: satisfy V0.4.2 queue lint"
            git push origin HEAD:feat/durable-supabase-runtime-v0.4.2
          fi
