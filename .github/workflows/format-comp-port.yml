name: Format Comp frontend port

on:
  push:
    branches:
      - feat/comp-ai-frontend-port-v0.4.2
    paths:
      - .github/workflows/format-comp-port.yml

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - name: Apply safe Biome fixes to frontend port
        run: |
          bunx biome check --write \
            web/app.tsx \
            web/globals.css \
            web/components/oplera-shell.tsx \
            web/components/recovery-composer.tsx \
            web/components/ui/button.tsx \
            web/components/ui/badge.tsx \
            web/components/ui/card.tsx \
            web/components/ui/table.tsx \
            web/components/ui/dashboard.tsx \
            web/components/ui/command.tsx \
            web/tools/recovery/operator-console.tsx
      - name: Remove known unused imports only
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('web/tools/recovery/operator-console.tsx')
          text = path.read_text()
          for name in ('\tBot,\n', '\tCheckCircle2,\n', '\tClock3,\n'):
              text = text.replace(name, '')
          path.write_text(text)
          PY
          bunx biome check --write web/tools/recovery/operator-console.tsx
      - name: Remove temporary workflow and commit formatter output
        run: |
          rm .github/workflows/format-comp-port.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add web .github/workflows/format-comp-port.yml
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "chore: normalize frontend port formatting"
          git push origin HEAD:feat/comp-ai-frontend-port-v0.4.2
