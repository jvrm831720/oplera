name: Finalize V0.4.2 once

on:
  push:
    branches:
      - feat/durable-supabase-runtime-v0.4.2

permissions:
  contents: write

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - run: bun install --frozen-lockfile
      - name: Apply repository Biome fixes
        run: bunx biome check --write .
      - name: Remove one-shot workflow
        run: rm .github/workflows/finalize-v0.4.2.yml
      - name: Commit formatted durable runtime
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "style: align V0.4.2 durable runtime"
            git push origin HEAD:feat/durable-supabase-runtime-v0.4.2
          fi
