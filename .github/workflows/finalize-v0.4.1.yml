name: Finalize V0.4.1 once

on:
  push:
    branches:
      - feat/live-pilot-readiness-v0.4.1

permissions:
  contents: write

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/live-pilot-readiness-v0.4.1
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - name: Apply repository Biome fixes
        run: bunx biome check --write api/pilot api/app.ts
      - name: Remove one-shot workflow
        run: rm .github/workflows/finalize-v0.4.1.yml
      - name: Commit formatted pilot implementation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add api/pilot api/app.ts .github/workflows/finalize-v0.4.1.yml
          git diff --cached --quiet || git commit -m "style: align V0.4.1 pilot implementation"
          git push origin HEAD:feat/live-pilot-readiness-v0.4.1
