name: Format Seller Copilot V0.5

on:
  push:
    branches:
      - feat/seller-copilot-v0.5

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - name: Remove forbidden non-null assertion
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('api/copilot/revenue-context-service.ts')
          text = path.read_text()
          old = '''\t\tconst top = matches.filter((item) => item.score === topScore);\n\t\tif (top.length === 1 && topScore >= 70) {\n\t\t\tconst match = resolveMatch(top[0]!.source);\n\t\t\treturn { status: "resolved", match, matches: normalized };\n\t\t}'''
          new = '''\t\tconst top = matches.filter((item) => item.score === topScore);\n\t\tconst resolved = top[0];\n\t\tif (top.length === 1 && topScore >= 70 && resolved) {\n\t\t\tconst match = resolveMatch(resolved.source);\n\t\t\treturn { status: "resolved", match, matches: normalized };\n\t\t}'''
          if old not in text:
              raise SystemExit('expected non-null assertion block not found')
          path.write_text(text.replace(old, new))
          PY
      - name: Apply safe Biome formatting and import organization
        run: bunx biome check --write .
      - name: Commit formatter output and remove temporary workflow
        run: |
          rm .github/workflows/format-seller-copilot-v0.5.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          echo "Changed files:"
          git diff --cached --name-only
          git commit -m "chore: format Seller Copilot V0.5"
          git push origin HEAD:feat/seller-copilot-v0.5
