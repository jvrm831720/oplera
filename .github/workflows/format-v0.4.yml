name: Format V0.4 once

on:
  push:
    branches:
      - feat/autonomous-revenue-recovery-v0.4

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/autonomous-revenue-recovery-v0.4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - name: Apply repository Biome fixes
        run: bunx biome check --write .
      - name: Remove one-shot workflow
        run: rm .github/workflows/format-v0.4.yml
      - name: Commit formatted sources
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "style: format V0.4 sources"
          git push origin HEAD:feat/autonomous-revenue-recovery-v0.4
