name: Temporary full history security scan

on:
  push:
    paths:
      - ".github/workflows/security-history-scan.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  history-security-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout complete history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fetch all refs
        shell: bash
        run: |
          git fetch --all --tags --prune --force
          echo "Commits reachable from all refs: $(git rev-list --all | sort -u | wc -l)"

      - name: Scan every reachable commit
        shell: bash
        run: |
          python3 - <<'PY'
          import re
          import subprocess
          import sys

          provider_patterns = [
              ("AWS_ACCESS_KEY", re.compile(r"\b(?:AKIA|ASIA)[0-9A-Z]{16}\b")),
              ("GITHUB_TOKEN", re.compile(r"\b(?:gh[pousr]_[A-Za-z0-9_]{30,}|github_pat_[A-Za-z0-9_]{50,})\b")),
              ("OPENAI_STYLE_KEY", re.compile(r"\bsk-[A-Za-z0-9_-]{20,}\b")),
              ("STRIPE_LIVE_KEY", re.compile(r"\b(?:sk|rk)_live_[0-9A-Za-z]{16,}\b")),
              ("GOOGLE_API_KEY", re.compile(r"\bAIza[0-9A-Za-z_-]{35}\b")),
              ("SLACK_TOKEN", re.compile(r"\bxox[baprs]-[0-9A-Za-z-]{20,}\b")),
              ("META_ACCESS_TOKEN", re.compile(r"\bEAA[A-Za-z0-9]{20,}\b")),
              ("SENDGRID_KEY", re.compile(r"\bSG\.[A-Za-z0-9_-]{16,}\.[A-Za-z0-9_-]{16,}\b")),
              ("PRIVATE_KEY_BLOCK", re.compile(r"-----BEGIN (?:RSA |EC |OPENSSH |DSA )?PRIVATE KEY-----")),
          ]

          generic = re.compile(
              r"""(?ix)
              \b(api[_-]?key|access[_-]?token|auth[_-]?token|secret|client[_-]?secret|
                 password|passwd|private[_-]?key|service[_-]?role[_-]?key|webhook[_-]?secret)
              \b\s*[:=]\s*
              [\"']?([^\s\"'#,;]{12,})[\"']?
              """
          )

          placeholder_words = (
              "example", "placeholder", "changeme", "change-me", "your_", "your-",
              "your.", "dummy", "fake", "sample", "test_", "test-", "<", "...",
              "xxx", "replace", "localhost"
          )

          risky_name_patterns = [
              re.compile(r"(^|/)\.env$", re.I),
              re.compile(r"(^|/)\.env\.(?!example$|sample$|template$)[^/]+$", re.I),
              re.compile(r"(^|/)(?:id_rsa|id_dsa|id_ecdsa|id_ed25519)$", re.I),
              re.compile(r"(^|/).+\.(?:pem|p12|pfx|key)$", re.I),
              re.compile(r"(^|/)(?:credentials?|service[-_]?account|secrets?)(?:\.[^/]+)?$", re.I),
          ]

          commits = subprocess.check_output(
              ["git", "rev-list", "--all"], text=True
          ).splitlines()
          commits = list(dict.fromkeys(commits))

          findings = set()
          risky_files = set()
          scanned_text_blobs = 0

          for idx, commit in enumerate(commits, 1):
              names = subprocess.check_output(
                  ["git", "ls-tree", "-r", "--name-only", commit],
                  text=True, errors="replace"
              ).splitlines()

              for path in names:
                  if any(p.search(path) for p in risky_name_patterns):
                      if not path.lower().endswith((".env.example", ".env.sample", ".env.template")):
                          risky_files.add((commit, path))

              proc = subprocess.run(
                  ["git", "grep", "-I", "-n", "-E",
                   r"(AKIA|ASIA)[0-9A-Z]{16}|gh[pousr]_[A-Za-z0-9_]{30,}|github_pat_[A-Za-z0-9_]{50,}|sk-[A-Za-z0-9_-]{20,}|(sk|rk)_live_[0-9A-Za-z]{16,}|AIza[0-9A-Za-z_-]{35}|xox[baprs]-[0-9A-Za-z-]{20,}|EAA[A-Za-z0-9]{20,}|SG\.[A-Za-z0-9_-]{16,}\.[A-Za-z0-9_-]{16,}|BEGIN (RSA |EC |OPENSSH |DSA )?PRIVATE KEY|(api[_-]?key|access[_-]?token|auth[_-]?token|secret|client[_-]?secret|password|passwd|private[_-]?key|service[_-]?role[_-]?key|webhook[_-]?secret)[[:space:]]*[:=]",
                   commit, "--", "."],
                  text=True, stdout=subprocess.PIPE, stderr=subprocess.DEVNULL,
                  errors="replace"
              )

              for raw in proc.stdout.splitlines():
                  # git grep output: <commit>:<path>:<line>:<content>
                  parts = raw.split(":", 3)
                  if len(parts) != 4:
                      continue
                  _, path, line_no, content = parts
                  scanned_text_blobs += 1

                  matched = False
                  for label, pattern in provider_patterns:
                      if pattern.search(content):
                          lower = content.lower()
                          if not any(w in lower for w in placeholder_words):
                              findings.add((label, commit, path, line_no))
                          matched = True

                  m = generic.search(content)
                  if m:
                      value = m.group(2).lower()
                      if not any(w in value for w in placeholder_words):
                          # Ignore common code references where the value is clearly a variable/expression.
                          if not value.startswith(("$", "process.", "env.", "os.", "config.", "settings.")):
                              findings.add(("GENERIC_SECRET_ASSIGNMENT", commit, path, line_no))

              if idx % 50 == 0:
                  print(f"Progress: {idx}/{len(commits)} commits")

          print("")
          print("=== SECURITY HISTORY SCAN SUMMARY ===")
          print(f"COMMITS_SCANNED={len(commits)}")
          print(f"SECRET_FINDINGS={len(findings)}")
          print(f"HIGH_RISK_FILE_VERSIONS={len(risky_files)}")

          for label, commit, path, line_no in sorted(findings):
              print(f"FINDING|{label}|{commit}|{path}|line={line_no}|VALUE_REDACTED")

          for commit, path in sorted(risky_files):
              print(f"RISKY_FILE|{commit}|{path}")

          if findings or risky_files:
              sys.exit(2)
          PY
