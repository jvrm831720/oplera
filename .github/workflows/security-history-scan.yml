name: Temporary full history security scan

on:
  push:
    paths:
      - ".github/workflows/security-history-scan.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  history-security-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout complete history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fetch all refs
        shell: bash
        run: |
          git fetch --all --tags --prune --force
          echo "Commits reachable from all refs: $(git rev-list --all | sort -u | wc -l)"

      - name: Scan every reachable commit
        shell: bash
        run: |
          python3 - <<'PY'
          import re
          import subprocess
          import sys
          from pathlib import PurePosixPath

          provider_patterns = [
              ("AWS_ACCESS_KEY", re.compile(r"\b(?:AKIA|ASIA)[0-9A-Z]{16}\b")),
              ("GITHUB_TOKEN", re.compile(r"\b(?:gh[pousr]_[A-Za-z0-9_]{30,}|github_pat_[A-Za-z0-9_]{50,})\b")),
              ("OPENAI_KEY", re.compile(r"\bsk-(?:proj-)?[A-Za-z0-9_-]{20,}\b")),
              ("ANTHROPIC_KEY", re.compile(r"\bsk-ant-[A-Za-z0-9_-]{20,}\b")),
              ("GROQ_KEY", re.compile(r"\bgsk_[A-Za-z0-9_-]{20,}\b")),
              ("STRIPE_LIVE_KEY", re.compile(r"\b(?:sk|rk)_live_[0-9A-Za-z]{16,}\b")),
              ("GOOGLE_API_KEY", re.compile(r"\bAIza[0-9A-Za-z_-]{35}\b")),
              ("SLACK_TOKEN", re.compile(r"\bxox[baprs]-[0-9A-Za-z-]{20,}\b")),
              ("META_ACCESS_TOKEN", re.compile(r"\bEAA[A-Za-z0-9]{20,}\b")),
              ("SENDGRID_KEY", re.compile(r"\bSG\.[A-Za-z0-9_-]{16,}\.[A-Za-z0-9_-]{16,}\b")),
              ("SUPABASE_SECRET_KEY", re.compile(r"\bsb_secret_[A-Za-z0-9_-]{20,}\b")),
              ("VERCEL_BLOB_RW", re.compile(r"\bvercel_blob_rw_[A-Za-z0-9_-]{20,}\b")),
              ("PRIVATE_KEY_BLOCK", re.compile(r"-----BEGIN (?:RSA |EC |OPENSSH |DSA )?PRIVATE KEY-----")),
              ("DATABASE_URL_WITH_PASSWORD", re.compile(r"\b(?:postgres(?:ql)?|mysql|mongodb(?:\+srv)?)://[^\s:'\"]+:[^@\s'\"]{8,}@[^\s'\"]+")),
          ]

          # Only literal quoted assignments. This intentionally ignores references like
          # secret: process.env.SECRET and type declarations such as secret: string.
          generic_literal = re.compile(
              r"""(?ix)
              \b(api[_-]?key|access[_-]?token|auth[_-]?token|secret|client[_-]?secret|
                 password|passwd|private[_-]?key|service[_-]?role[_-]?key|webhook[_-]?secret|
                 encryption[_-]?key|jwt[_-]?secret)
              \b\s*[:=]\s*
              [\"']([^\"'\r\n]{12,})[\"']
              """
          )

          placeholder_words = (
              "example", "placeholder", "changeme", "change-me", "your_", "your-",
              "your.", "dummy", "fake", "sample", "test-secret", "test_key",
              "test-key", "<", "...", "xxx", "replace-me", "localhost",
              "not-a-real", "development-only"
          )

          risky_name_patterns = [
              re.compile(r"(^|/)\.env$", re.I),
              re.compile(r"(^|/)\.env\.[^/]+$", re.I),
              re.compile(r"(^|/)(?:id_rsa|id_dsa|id_ecdsa|id_ed25519)$", re.I),
              re.compile(r"(^|/).+\.(?:pem|p12|pfx|key)$", re.I),
              re.compile(r"(^|/)(?:credentials?|service[-_]?account|secrets?)(?:\.[^/]+)?$", re.I),
          ]

          def is_example_path(path: str) -> bool:
              base = PurePosixPath(path).name.lower()
              return (
                  ".example" in base or ".sample" in base or ".template" in base
                  or base.endswith(".dist") or base in {"env.example", "env.sample"}
              )

          commits = subprocess.check_output(["git", "rev-list", "--all"], text=True).splitlines()
          commits = list(dict.fromkeys(commits))
          findings = set()
          risky_files = set()

          grep_expr = (
              r"(AKIA|ASIA)[0-9A-Z]{16}|gh[pousr]_[A-Za-z0-9_]{30,}|"
              r"github_pat_[A-Za-z0-9_]{50,}|sk-(proj-)?[A-Za-z0-9_-]{20,}|"
              r"sk-ant-[A-Za-z0-9_-]{20,}|gsk_[A-Za-z0-9_-]{20,}|"
              r"(sk|rk)_live_[0-9A-Za-z]{16,}|AIza[0-9A-Za-z_-]{35}|"
              r"xox[baprs]-[0-9A-Za-z-]{20,}|EAA[A-Za-z0-9]{20,}|"
              r"SG\.[A-Za-z0-9_-]{16,}\.[A-Za-z0-9_-]{16,}|"
              r"sb_secret_[A-Za-z0-9_-]{20,}|vercel_blob_rw_[A-Za-z0-9_-]{20,}|"
              r"BEGIN (RSA |EC |OPENSSH |DSA )?PRIVATE KEY|"
              r"(api[_-]?key|access[_-]?token|auth[_-]?token|secret|client[_-]?secret|"
              r"password|passwd|private[_-]?key|service[_-]?role[_-]?key|"
              r"webhook[_-]?secret|encryption[_-]?key|jwt[_-]?secret)[[:space:]]*[:=]"
          )

          for idx, commit in enumerate(commits, 1):
              names = subprocess.check_output(
                  ["git", "ls-tree", "-r", "--name-only", commit],
                  text=True, errors="replace"
              ).splitlines()

              for path in names:
                  if any(p.search(path) for p in risky_name_patterns) and not is_example_path(path):
                      risky_files.add((commit, path))

              proc = subprocess.run(
                  ["git", "grep", "-I", "-n", "-E", grep_expr, commit, "--", "."],
                  text=True, stdout=subprocess.PIPE, stderr=subprocess.DEVNULL,
                  errors="replace"
              )

              for raw in proc.stdout.splitlines():
                  parts = raw.split(":", 3)
                  if len(parts) != 4:
                      continue
                  _, path, line_no, content = parts
                  lower = content.lower()

                  for label, pattern in provider_patterns:
                      if pattern.search(content) and not any(w in lower for w in placeholder_words):
                          findings.add((label, commit, path, line_no))

                  m = generic_literal.search(content)
                  if m:
                      value = m.group(2).strip().lower()
                      if (
                          not any(w in value for w in placeholder_words)
                          and len(value) >= 12
                          and not value.startswith(("process.", "env.", "os.", "config.", "settings."))
                      ):
                          findings.add(("HARDCODED_SECRET_LITERAL", commit, path, line_no))

              if idx % 50 == 0:
                  print(f"Progress: {idx}/{len(commits)} commits")

          # Collapse repeated historical versions to unique finding locations for summary,
          # while retaining the earliest and latest commit evidence in log lines.
          unique_locations = {}
          for label, commit, path, line_no in findings:
              unique_locations.setdefault((label, path, line_no), []).append(commit)

          unique_risky = {}
          for commit, path in risky_files:
              unique_risky.setdefault(path, []).append(commit)

          print("")
          print("=== SECURITY HISTORY SCAN SUMMARY ===")
          print(f"COMMITS_SCANNED={len(commits)}")
          print(f"UNIQUE_SECRET_LOCATIONS={len(unique_locations)}")
          print(f"UNIQUE_HIGH_RISK_FILES={len(unique_risky)}")

          for (label, path, line_no), shas in sorted(unique_locations.items()):
              print(f"FINDING|{label}|{path}|line={line_no}|versions={len(shas)}|commit={sorted(shas)[0]}|VALUE_REDACTED")

          for path, shas in sorted(unique_risky.items()):
              print(f"RISKY_FILE|{path}|versions={len(shas)}|commit={sorted(shas)[0]}")

          if unique_locations or unique_risky:
              sys.exit(2)
          PY
